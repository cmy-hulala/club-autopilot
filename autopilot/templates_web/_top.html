<header class="top">
  {% if brand.logo_url %}<img src="{{ brand.logo_url }}" alt="{{ brand.alt }}">{% endif %}
  <div>
    <b>Club Autopilot</b>
    {% if brand.name %} · <span data-no-i18n>{{ brand.name }}</span>{% else %} · {{ ui.header_fallback }}{% endif %}
  </div>
  <nav class="topnav" aria-label="{{ ui.nav_label }}">
    <a href="/">{{ ui.nav_dashboard }}</a>
    <a href="/onboarding">{{ ui.nav_onboarding }}</a>
    <a href="/modules">{{ ui.nav_modules }}</a>
  </nav>
  <div class="langsw" data-no-i18n><button type="button" data-setlang="zh">中文</button><button type="button" data-setlang="en">English</button></div>
</header>
