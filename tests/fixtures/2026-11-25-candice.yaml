hook: 在最迷惘的 20 幾歲，應該如何找到自己的職涯方向？
hook_lead: "{session}，我們邀請到「行銷 x 斜槓大小事」創辦人謝慈 Candice，分享她畢業不到六年，從大公司、新創走到一人公司的職涯大轉彎。"
intro:
  - 謝慈 Candice 是「行銷 x 斜槓大小事」創辦人，也是靈島者學院合作講師。
  - 從大公司、新創、再到一人公司，畢業不到六年的時間，她的職涯方向大轉彎。這次她會分享自己從 20 幾歲超級迷惘，到堅定自己想做的路的心路歷程。
  - 她從大學時期開始經營自媒體，五年後成為開課講師與行銷顧問，一步步靠著接案、自媒體，從沒資源、沒人脈的超級素人闖出自己的一條路。
highlights:
  - title: 從大公司、新創、再到一人公司，畢業不到六年的時間，職涯方向為什麼大轉彎？
    body: 在最迷惘的 20 幾歲，應該如何找到自己的職涯方向，究竟怎麼樣才是「正確」的選擇呢？分享 Candice 從 20 幾歲超級迷惘，到堅定自己想做的路的心路歷程。
  - title: 沒資源、沒人脈，想創業該如何踏出第一步？
    body: 從大學時期開始經營自媒體，五年後成為開課講師與行銷顧問，分享如何從沒資源、沒人脈的超級素人，一步步靠著接案、自媒體闖出自己的一條路。
  - title: AI 時代下，有什麼是不可取代的護城河
    body: AI 時代之下，好像什麼技能都會被取代，對於想創業的人來說，有哪一些硬實力或軟實力是在這個快速變化的時代不可取代的護城河呢？
closing: 一起聊聊在 AI 時代，怎麼打造別人拿不走的競爭力。
feedback_questions:
  - 我對於如何在迷惘中找到自己的職涯方向，有更具體的想法
  - 我更了解沒資源、沒人脈時，如何踏出一人創業的第一步
