intro:
  - 林可恩是這份範例裡的虛構講者，用來示範社團流程，不是真人。
  - 這堂課走一遍從問題、訪談到一個最小實驗的順序。
  - 你可以把這份檔案複製出去，改成自己社團的標題、講者和教室。
highlights:
  - title: 怎麼把一個大點子收成一個可以問人的問題？
    body: 用一個虛構的校園點子，練習把想法寫成別人聽得懂的一句話。
  - title: 第一位使用者可能就在隔壁教室
    body: 示範怎麼約一次短訪談，以及要問哪些不帶答案的問題。
  - title: 一個週末能做完的小實驗
    body: 不需要公司、資金或真實客戶名單，也能走完一次最小驗證。
closing: 這是虛構範例。試完預覽之後，換成你自己的社課。
feedback_questions:
